[mod-name]
FilterHelper=Ajudante de Filtro

[mod-description]
FilterHelper=Adiciona seletores rápidos de contexto para definir filtros.

[fh]
button-tooltip=__1__\n__CONTROL__pipette__ para pipetar ao cursor.\n__2__
tooltip-filters=__CONTROL_LEFT_CLICK__ para definir o filtro.\n__CONTROL_RIGHT_CLICK__ para remover o filtro.
tooltip-container-filters=__CONTROL_LEFT_CLICK__ para definir o filtro.\n__CONTROL_RIGHT_CLICK__ para remover o filtro.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ para definir o filtro sob todos os deste item.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ para definir este filtro em todos os espaços válidos.\n__CONTROL_KEY_CTRL__ + __CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ para definir este filtro em [font=default-bold]todos[/font] os espaços.\n(__CONTROL_KEY_SHIFT__ ou __CONTROL_KEY_CTRL__) + __CONTROL_RIGHT_CLICK__ para remover este filtro de todos os espaços.
tooltip-requests=__CONTROL_LEFT_CLICK__ para aumentar o pedido em 1 pilha.\n__CONTROL_RIGHT_CLICK__ para diminuir o pedido em 1 pilha.\n__CONTROL_KEY_SHIFT__ + __CONTROL_LEFT_CLICK__ para aumentar o pedido em 5 pilhas.\n__CONTROL_KEY_SHIFT__ + __CONTROL_RIGHT_CLICK__ para diminuir o pedido em 5 pilhas.\n__CONTROL_KEY_CTRL__ + __CONTROL_LEFT_CLICK__ para definir o pedido para encher o contêiner.\n__CONTROL_KEY_CTRL__ + __CONTROL_RIGHT_CLICK__ para remover o pedido.
filters-full=Filtros cheios
filters-empty=Filtros vazios
requests-full=Pedidos cheios
requests-empty=Pedidos vazios

[mod-setting-name]
fh-set-filter-on-inserter=Ativar filtros ao definir filtro para insersor
fh-default-item-on-splitter=Definir um item para sempre mostrar nos separadores
fh-add-fuel-items=Adicionar itens de combustível compatíveis aos filtros
fh-show-only-unlocked-qualities=Mostrar apenas qualidades de resultado já desbloqueadas

[mod-setting-description]
fh-set-filter-on-inserter=Ativa a caixa "Usar filtros" ao definir um filtro para um insersor
fh-default-item-on-splitter=Nome de um item para sempre mostrar nos separadores, por exemplo, deconstruction-planner. Deixe vazio para desativar.
fh-add-fuel-items=Adiciona itens de combustível compatíveis e seus resultados, mesmo que não apareçam nas entradas e saídas
fh-show-only-unlocked-qualities=Uma fabricadora com módulos de qualidade não mostra qualidades além das pesquisadas nos filtros de resultado
