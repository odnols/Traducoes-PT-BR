[mod-setting-description]
waterfill-00=Se um objeto (jogador, máquina, esteiras, árvores, etc.) estiver na área de posicionamento, a água só será colocada ao redor dele.\n\nDesativar esta opção pode resultar em morte ou perda de construções!
waterfill-01=Permite colocar água sobre tocos de árvore.
waterfill-02=Permite colocar em qualquer planeta (muito roubado, não tem jeito)
