[mod-name]
light-overhaul=Iluminação revisada

[mod-description]
light-overhaul=Altera as configurações de iluminação do jogo com LUTs. As noites parecem mais escuras, mas têm maior contraste. O personagem tem um cone de lanterna mais amplo. A visão noturna não dessatura tudo. Versão independente das mudanças de iluminação do AAI Industry.

[mod-setting-name]
wide-flashlight=Lanterna ampla
enhanced-nightvision=Visão noturna aprimorada
night-lut-set=Conjunto de LUT noturno

[mod-setting-description]
wide-flashlight=Substitui a lanterna do personagem por uma versão mais ampla.
enhanced-nightvision=Usa uma LUT de visão noturna que não dessatura a tela; adiciona um leve realce esverdeado a algumas sombras.
night-lut-set=A intensidade do efeito de escuridão noturna.

