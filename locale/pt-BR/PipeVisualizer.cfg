[mod-name]
PipeVisualizer-Updated=Visualizador de canos 2.0

[mod-description]
PipeVisualizer-Updated=Visualize o layout e o conteúdo de redes de canos. Pressione Y para desenhar os sistemas de fluido da entidade selecionada. Pressione Shift + Y para desenhar todos os sistemas de fluido visíveis. Pressione Alt + Y para visualizar automaticamente os sistemas ao passar o mouse sobre eles. Pressione Control + Y para alternar entre a exibição de cores por fluido e por sistema.

[controls]
pv-color-by-fluid-system=Colorir por sistema de fluido
pv-toggle-mouseover=Alternar visualizador de canos ao passar o mouse
pv-toggle-overlay=Alternar sobreposição do visualizador de canos
pv-visualize-selected=Visualizar o sistema de canos selecionado

[message]
pv-color-by-fluid=Colorir por fluido
pv-color-by-system=Colorir por sistema
pv-mouseover-disabled=Visualizador de canos ao passar o mouse desativado
pv-mouseover-enabled=Visualizador de canos ao passar o mouse ativado

[mod-setting-description]
pv-entities-per-tick=Números maiores aumentam o impacto no UPS, principalmente ao usar a sobreposição.

[mod-setting-name]
pv-entities-per-tick=Entidades por tique
pv-overlay-opacity=Opacidade da sobreposição
pv-color-pumps=Colorir bombas na sobreposição
pv-overlay-scale=Escala do alcance da sobreposição. Útil para visualizar no mapa
pv-allow-ultrawide=Ativar suporte a telas ultralargas. Pode causar lentidão.

[shortcut-name]
pv-toggle-mouseover=Alternar visualizador de canos ao passar o mouse
pv-toggle-overlay=Alternar sobreposição do visualizador de canos
