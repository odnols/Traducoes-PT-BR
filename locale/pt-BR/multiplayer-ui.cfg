[mod-name]
multiplayer-ui=Interface de multijogador

[mod-description]
multiplayer-ui=Mostra a lista de jogadores no servidor.

[mod-setting-name]
multiplayer-ui-show-online-time=Mostrar tempo online dos jogadores
multiplayer-ui-show-distance=Mostrar distância até o jogador
multiplayer-ui-show-group=Mostrar grupo do jogador
multiplayer-ui-show-afk-time=Mostrar tempo inativo
multiplayer-ui-show-team=Mostrar a equipe do jogador
multiplayer-ui-max-players=Número máximo de jogadores
multiplayer-ui-show-armor=Mostrar armadura dos jogadores
multiplayer-ui-show-offline=Mostrar jogadores offline
multiplayer-ui-compact-mode=Modo compacto
multiplayer-ui-debug-log=Registro de depuração

[mod-setting-description]
multiplayer-ui-compact-mode=Comprime o painel e abrevia os nomes dos jogadores para 6 caracteres (por padrão, são abreviados para 12). Use se a lista de jogadores estiver ocupando muito espaço na tela.
