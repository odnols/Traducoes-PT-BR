[mod-name]
enhanced-shadows=Sombras Aprimoradas

[mod-description]
enhanced-shadows=Substitui ativos comumente usados contendo sombras incorporadas por sprites multicamadas contendo mais detalhes.

[mod-setting-name]
enhanced-shadows-separate-shadows=Sombras divididas de sprites
enhanced-shadows-change-planet-shadow-opacity=Alterar opacidades de sombra de outros planetas

[mod-setting-description]
enhanced-shadows-separate-shadows=Substitui certos sprites padrões sem uma camada de sombra separada (por exemplo, canos) por sprites multicamadas contendo uma camada de primeiro plano e uma camada de sombra. Melhora a aparência das sombras aprimoradas, mas pode apresentar problemas de compatibilidade.
enhanced-shadows-change-planet-shadow-opacity=Altera as opacidades das sombras em outros planetas para refletir melhor os níveis de difusão da luz atmosférica que suas pressões indicariam.
