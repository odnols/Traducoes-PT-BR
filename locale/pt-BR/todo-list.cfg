[mod-name]
Todo-List=✔ Lista de tarefas

[mod-description]
Todo-List=✔ Este mod adiciona uma lista de tarefas ao jogo (tanto para um jogador quanto para multijogador) para permitir que os jogadores sincronizem suas atividades.

