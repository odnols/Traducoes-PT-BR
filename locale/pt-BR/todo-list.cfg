[mod-setting-description]
todolist-show-button=Se ativado, sempre mostra um botão "Lista de tarefas" no canto superior esquerdo.\nSe desativado, a lista de tarefas só pode ser acessada pela tecla de atalho (padrão shift-t).
todolist-show-log=Se ativado, o mod imprime mensagens de depuração na janela de chat.\nAtenção: há muitas delas :)
todolist-window-height=A altura da janela da lista de tarefas. O padrão é 600.
todolist-auto-assign=Se houver apenas um jogador no jogo, atribui a tarefa a esse jogador automaticamente.
todolist-click-edit-task=Se ativado, o clique do meio abre a janela de edição. O padrão é o clique com o botão direito.
todolist-translation-mode=Estilo de texto da lista de tarefas. "Registro de tarefas" muda a terminologia para a de um registro de tarefas.

