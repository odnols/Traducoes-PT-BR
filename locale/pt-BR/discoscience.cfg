[mod-name]
DiscoScience=Ciência Disco

[mod-description]
DiscoScience=Laboratórios se iluminarão com as cores dos ingredientes que eles estão consumindo, ao invés de sempre azul. Receitas avançadas proporcionam um show mais bonito! Se o seu jogo estiver ficando lento, tente desativar a opção "Alta qualidade" nas configurações do mod.

[errors]
unregistered-lab-deleted=O DiscoScience detectou um laboratório não registrado.
unregistered-entity-created=O DiscoScience detectou a criação de uma entidade não especificada.
registered-lab-deleted=O DiscoScience não foi notificado sobre a exclusão de um laboratório.
lab-registered-twice=O DiscoScience foi notificado duas vezes sobre a criação de um laboratório.
please-report=Isto geralmente indica um pequeno erro em outro mod. Por favor, relate este problema em mods.factorio.com/mod/DiscoScience\n\nVocê pode continuar jogando, mas alguns laboratórios podem não animar corretamente. Esta mensagem não aparecerá novamente nesta sessão.

[mod-setting-name]
discoscience-high-quality=Alta qualidade

[mod-setting-description]
discoscience-high-quality=Padrões mais interessantes. Desative para melhorar o desempenho.
